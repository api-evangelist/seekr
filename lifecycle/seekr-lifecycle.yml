versioning:
  scheme: uri-path
  current: v1
  additional:
  - version: v2
    scope: agents only
    paths: /v2/flow/agents/*
    note: >-
      v2 agent operations run alongside the v1 set rather than replacing them; both are declared
      in the same OpenAPI document with no deprecation marker on the v1 operations.
  spec_versions:
    llm-training: 5.108.1
    agents: 5.45.1
    explainability: 5.17.1
    serving: 0.1.0
  note: >-
    The info.version of each spec tracks the SeekrFlow service build, not the URI API version.
    Four separate OpenAPI documents all titled "SeekrFlow API" carry four different versions.
  docs: https://docs.seekr.com/flow/reference/getting-started-with-your-api
deprecation:
  policy_documented: true
  policy_text: >-
    "When breaking changes are introduced: a new API version is released; the current version
    continues to function; you receive notification with migration timelines before deprecation."
  policy_url: https://docs.seekr.com/flow/reference/getting-started-with-your-api#versioning
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    The policy is a prose commitment on the getting-started page. Seekr does not emit RFC 8594
    Sunset or Deprecation response headers, and no operation in any of the four OpenAPI documents
    carries `deprecated: true` — deprecations are announced in the changelog instead.
  announced_deprecations:
