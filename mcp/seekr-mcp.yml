- id: well-known-mcp-points-at-preview-host
  detail: https://docs.seekr.com/.well-known/mcp.json advertises the server URL as https://seekr.main-kill-isr.mintlify.me/mcp
    — a Mintlify branch-preview hostname — while the documentation instructs users to configure https://docs.seekr.com/mcp.
