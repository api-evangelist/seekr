scope: 'This is a DOCUMENTATION MCP server, not a SeekrFlow control-plane server. It exposes the SeekrFlow
  OpenAPI specs and docs to a coding assistant so the assistant can generate correct, authenticated SeekrFlow
  API calls; it does NOT expose tools that create agents, launch fine-tunes, or run inference. Those remain
  REST-only against https://flow.seekr.com/v1. Seekr documents this explicitly: "Connect your AI assistant
  to the SeekrFlow OpenAPI spec to generate working, authenticated code on demand."'
tools:
- name: search_seekr
  title: Search documentation
  description: Search across the Seekr knowledge base to find relevant information, code examples, API
    references, and guides.
  input_schema:
    query: string (required)
  read_only: true
- name: query_docs_filesystem_seekr
  description: Read-only shell-like query (rg/grep/find/tree/ls/cat/head/tail/jq …) against a virtualized
    in-memory filesystem containing ONLY the Seekr documentation pages and the SeekrFlow OpenAPI specs.
    Output truncated to 30KB per call.
  input_schema:
    command: string (required)
  read_only: true
  exposes:
  - /openapi/agents.json
  - /openapi/explainability.json
  - /openapi/llm-training.json
  - /openapi/serving.json
  - /flow/**.mdx
