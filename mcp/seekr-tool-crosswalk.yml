source: mcp/seekr-mcp-tools.json + openapi/seekr-*-openapi.json
summary: >-
  Seekr's MCP surface and Seekr's REST surface do not overlap at all. The published MCP server is
  a documentation-plane server: its three tools search and read Seekr's own docs and OpenAPI
  files. Every one of the 212 SeekrFlow REST operations is reachable only over HTTPS against
  https://flow.seekr.com/v1 with an API key. There is therefore no tool-to-operation binding to
  record — the honest crosswalk is a full mcp_only / rest_only divergence, and recording it that
  way is the point: an agent that connects to the Seekr MCP server can LEARN the API but cannot
  CALL it.
