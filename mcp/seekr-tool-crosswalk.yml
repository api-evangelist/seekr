crosswalk: []
mcp_only:
- tool: search_seekr
  reason: >-
    Documentation search over the Seekr knowledge base. No SeekrFlow REST operation performs
    documentation search; the docs corpus is not part of the flow.seekr.com API.
- tool: query_docs_filesystem_seekr
  reason: >-
    Read-only virtual filesystem over the docs pages and the four SeekrFlow OpenAPI specs. Backed
    by the Mintlify docs platform, not by the SeekrFlow control plane. This tool is how the four
    OpenAPI specs in openapi/ were harvested — they are not served at any static URL on
    docs.seekr.com or flow.seekr.com.
- tool: submit_feedback
  reason: >-
    Writes documentation feedback to the Seekr docs team. No public REST equivalent.
