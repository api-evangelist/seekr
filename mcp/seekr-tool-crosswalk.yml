note: >-
  The gap is a genuine product decision, not a harvest failure. Seekr's own MCP page says the
  server exists so an assistant can "read endpoint definitions, parameters, request and response
  schemas, and authentication requirements — then use that information to generate working,
  authenticated code." Agent-callable SeekrFlow capability (create an agent, run a thread, launch
  a fine-tune) would require an MCP server on flow.seekr.com; none is published.
