aid: seekr
name: Seekr
description: >-
  Seekr Technologies builds explainable, auditable, sovereign AI for regulated industries and
  high-stakes government missions. Its platform, SeekrFlow, is an end-to-end AI operating system
  that covers document ingestion and AI-ready data preparation, vector databases and retrieval,
  instruction / LoRA / DPO / GRPO / vision-language fine-tuning, model deployment,
  OpenAI-compatible inference, and agent orchestration with tools — all wrapped in an
  explainability layer that traces every response back to the retrieved chunks, tool calls, spans
  and training examples that produced it. Companion products are SeekrGuard (third-party and
  open-weight model evaluation and certification), SeekrGeo (multimodal geospatial intelligence)
  and SeekrIntel (investigative entity mapping). SeekrFlow is reachable through a no-code web app,
  the seekrai Python SDK, and a REST API at flow.seekr.com, and deploys to Seekr's cloud, a
  customer cloud, on-premises, the edge or fully air-gapped environments.
