apis:
- name: SeekrFlow Platform API
  description: >-
    The core SeekrFlow control plane — agents (v1 and v2), custom tools, the AI-ready data engine
    (file ingestion, data jobs, alignment / instruction-pair generation), vector databases and
    chunk metadata, fine-tuning jobs, model deployments, projects, evaluations, feedback, pricing
    estimates and audit events. 108 paths over an API-key-authenticated, team-scoped REST surface.
  humanURL: https://docs.seekr.com/flow/reference/getting-started-with-your-api
  baseURL: https://flow.seekr.com/v1
