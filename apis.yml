- name: SeekrFlow Agent Runtime API
  description: >-
    The runtime half of SeekrFlow agents — threads, messages, runs (including SSE streaming and a
    Vercel AI SDK stream shape), run cancel and attach, uploaded custom Python functions used as
    agent tools, and span-level observability over every model call and tool invocation.
  humanURL: https://docs.seekr.com/flow/components/agents
  baseURL: https://flow.seekr.com/v1
  tags:
  - agents
  - observability
  - streaming
  properties:
  - type: OpenAPI
    url: openapi/seekr-agents-openapi.json
  - type: Overlay
    url: overlays/seekr-agents-overlay.yaml
  - type: Documentation
    url: https://docs.seekr.com/flow/components/agents
  - type: Authentication
    url: authentication/seekr-authentication.yml
- name: SeekrFlow Explainability API
  description: >-
    Seekr's differentiating surface — context attribution (which retrieved sources influenced an
    answer, from a stored run or an arbitrary response/context pair), training-data attribution
    via a per-model influence index, and source tracing back to the exact chunk in the original
    document.
  humanURL: https://docs.seekr.com/flow/components/explainability
  baseURL: https://flow.seekr.com/v1
  tags:
  - explainability
  - ai-governance
  - observability
  properties:
  - type: OpenAPI
    url: openapi/seekr-explainability-openapi.json
  - type: Overlay
    url: overlays/seekr-explainability-overlay.yaml
  - type: Documentation
    url: https://docs.seekr.com/flow/components/explainability
- name: SeekrFlow Inference & Serving API
  description: >-
    OpenAI-compatible inference — chat completions, completions, embeddings, rerank, score and
    audio transcription — plus batch jobs, file handling for batches, model listing, engine
    health/metrics and sleep/wake control for dedicated serving instances. Any OpenAI SDK can call
    it by changing base_url.
  humanURL: https://docs.seekr.com/flow/sdk/getting-started
  baseURL: https://flow.seekr.com/v1/inference
  tags:
  - inference
  - llm
  - embeddings
  - openai-compatible
  properties:
  - type: OpenAPI
    url: openapi/seekr-serving-openapi.json
  - type: Overlay
    url: overlays/seekr-serving-overlay.yaml
  - type: Documentation
    url: https://docs.seekr.com/flow/sdk/getting-started
- name: Seekr Documentation MCP Server
  description: >-
    A hosted, anonymous, read-only MCP server that gives an AI assistant direct access to the
    SeekrFlow documentation and the four SeekrFlow OpenAPI specs, so the assistant can generate
    working authenticated SeekrFlow code. Three tools — search_seekr,
    query_docs_filesystem_seekr and submit_feedback — plus a packaged Agent Skill exposed as an
    MCP resource. It is a documentation-plane server: it does not expose agent, fine-tuning or
    inference actions.
  humanURL: https://docs.seekr.com/flow/mcp
  baseURL: https://docs.seekr.com/mcp
  tags:
  - mcp
  - agent-native
  - documentation
  properties:
