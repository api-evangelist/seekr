apis:
- name: Seekr Documentation MCP Server
  description: >-
    A hosted, anonymous, read-only MCP server that gives an AI assistant direct access to the SeekrFlow
    documentation and the four SeekrFlow OpenAPI specs, so the assistant can generate working authenticated
    SeekrFlow code. Three tools — search_seekr, query_docs_filesystem_seekr and submit_feedback — plus
    a packaged Agent Skill exposed as an MCP resource. It is a documentation-plane server: it does not
    expose agent, fine-tuning or inference actions.
  humanURL: https://docs.seekr.com/flow/mcp
  baseURL: https://docs.seekr.com/mcp
  tags:
  - mcp
  - agent-native
  - documentation
  properties:
  - type: MCPServer
    url: mcp/seekr-mcp.yml
  - type: ToolCrosswalk
    url: mcp/seekr-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.seekr.com/mcp
