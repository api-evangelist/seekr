  api-catalog on any host. The documentation host (docs.seekr.com, Mintlify-hosted) is the only
  host with a populated /.well-known/ surface: an A2A agent card, an MCP server descriptor, and a
  packaged Agent Skill. The API host flow.seekr.com answers 404 on every /.well-known/ path
  probed, which is consistent with its API-key-only auth model (no OAuth, so no RFC 8414 / OIDC
  discovery documents to publish).
