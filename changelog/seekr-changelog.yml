summary: >-
  Seekr publishes two parallel dated changelogs — one for the Seekr-managed (SaaS) instance and
  one for self-hosted installations. The managed changelog is release-note style, dated to the
  day, and tagged Feature / Improvement / Fix / Deprecation. The self-hosted changelog carries an
  explicit product version (e.g. 6.2026.0, 5.2.5). Each entry also marks which surfaces it lands
  on (UI / API / SDK) and, where relevant, the minimum `seekrai` SDK version required.
scheme:
  managed: dated release notes, tagged (Feature | Improvement | Fix | Deprecation)
  self_hosted: dated release notes with a product version string
  api_versioning: URI path (v1, with v2 present for the agents resource)
