pipelines:
- name: raw documents to fine-tuned model
  chain: File -> IngestionJob -> DataJob -> AlignmentJob (QuestionAnswerPair) -> FineTuneJob -> Model -> Deployment
- name: retrieval-augmented agent
  chain: File -> VectorDatabase (Chunk) -> Tool(file_search) -> Agent -> Thread -> Run -> Message
- name: explainability
  chain: Run -> Span -> ContextAttribution / influential fine-tuning data -> source File + Chunk
