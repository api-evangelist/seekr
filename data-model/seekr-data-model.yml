summary: >-
  The SeekrFlow object graph derived from schema $refs and id-reference fields across the
  published OpenAPI documents. Everything hangs off two roots: a Team (the tenancy boundary — a
  team_id appears on almost every persisted entity) and a File (the raw material that becomes a
  vector database, a data job, an alignment dataset and ultimately a fine-tuned model). Runtime
  work is a separate spine: Agent → Thread → Run → Message/Span.
tenancy:
  root: Organization
  boundary: Team
  note: >-
    team_id and user_id are stamped on Agent, Deployment, Project, Tool, Image, PythonFunction and
    the tool response objects. Requests are scoped by the x-team-id header; omitting it targets the
    caller's personal workspace.
